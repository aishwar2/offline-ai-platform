name: Offline AI Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'offlineai' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ===========================================================================
  # Stage 1: Backend Lint, Frontend Lint & Unit Tests
  # ===========================================================================
  lint-and-test:
    name: Stage 1 - Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Backend lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Backend unit tests (pytest)
        working-directory: backend
        run: pytest -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend lint (eslint) & typecheck
        working-directory: frontend
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Frontend unit tests (vitest)
        working-directory: frontend
        run: npm test

  # ===========================================================================
  # Stage 2: Build Docker Images
  # ===========================================================================
  build-images:
    name: Stage 2 - Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend, frontend, and ollama images
        run: |
          docker build -t "${DOCKERHUB_NAMESPACE}/offline-ai-backend:${IMAGE_TAG}" ./backend
          docker build -t "${DOCKERHUB_NAMESPACE}/offline-ai-frontend:${IMAGE_TAG}" ./frontend
          docker build -t "${DOCKERHUB_NAMESPACE}/offline-ai-ollama:${IMAGE_TAG}" ./ollama

  # ===========================================================================
  # Stage 3: Push Images to Docker Hub
  # ===========================================================================
  push-images:
    name: Stage 3 - Push Images to Docker Hub
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push tagged & latest images
        run: |
          for svc in backend frontend ollama; do
            docker build -t "${DOCKERHUB_NAMESPACE}/offline-ai-${svc}:${IMAGE_TAG}" \
                         -t "${DOCKERHUB_NAMESPACE}/offline-ai-${svc}:latest" \
                         "./${svc}"
            docker push "${DOCKERHUB_NAMESPACE}/offline-ai-${svc}:${IMAGE_TAG}"
            docker push "${DOCKERHUB_NAMESPACE}/offline-ai-${svc}:latest"
          done

  # ===========================================================================
  # Stage 4: Deploy to Kubernetes
  # ===========================================================================
  deploy-kubernetes:
    name: Stage 4 - Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply Kubernetes manifests & update image tags
        run: |
          kubectl apply -k kubernetes/
          kubectl -n offline-ai set image deployment/backend \
            backend="${DOCKERHUB_NAMESPACE}/offline-ai-backend:${IMAGE_TAG}"
          kubectl -n offline-ai set image deployment/frontend \
            frontend="${DOCKERHUB_NAMESPACE}/offline-ai-frontend:${IMAGE_TAG}"
          kubectl -n offline-ai set image deployment/ollama \
            ollama="${DOCKERHUB_NAMESPACE}/offline-ai-ollama:${IMAGE_TAG}"
          kubectl -n offline-ai rollout status deployment/backend --timeout=180s
          kubectl -n offline-ai rollout status deployment/frontend --timeout=180s

  # ===========================================================================
  # Stage 5: Post-Deploy Health Checks
  # ===========================================================================
  health-checks:
    name: Stage 5 - Run Health Checks
    runs-on: ubuntu-latest
    needs: deploy-kubernetes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify live cluster health endpoints
        run: |
          kubectl -n offline-ai port-forward svc/backend 8000:8000 &
          PF_PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8000/health/live
          curl -fsS http://127.0.0.1:8000/health/ready
          curl -fsS http://127.0.0.1:8000/metrics | grep -q "offline_ai_http_requests_total"
          kill $PF_PID || true
