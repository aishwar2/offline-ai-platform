services:
  postgres:
    image: postgres:16-alpine
    container_name: offline-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offline_ai}
      POSTGRES_USER: ${POSTGRES_USER:-offline_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-offline_ai_user} -d ${POSTGRES_DB:-offline_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - offline_ai_net

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: offline-ai-ollama
    restart: unless-stopped
    environment:
      DEFAULT_MODEL: ${DEFAULT_MODEL:-tinyllama}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama_models:/home/ollama/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1900M
    networks:
      - offline_ai_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: offline-ai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret-key-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-offline_ai_user}:${POSTGRES_PASSWORD:-change-this-db-password}@postgres:5432/${POSTGRES_DB:-offline_ai}
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_MODEL: ${DEFAULT_MODEL:-tinyllama}
      AVAILABLE_MODELS: ${AVAILABLE_MODELS:-tinyllama,qwen2.5:0.5b}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      CHROMA_PERSIST_DIR: /app/data/chroma
      MCP_ENABLED: ${MCP_ENABLED:-true}
    volumes:
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    networks:
      - offline_ai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: offline-ai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
    networks:
      - offline_ai_net

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: offline-ai-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - offline_ai_net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: offline-ai-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks:
      - offline_ai_net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: offline-ai-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    networks:
      - offline_ai_net

volumes:
  postgres_data:
  ollama_models:
  chroma_data:
  prometheus_data:
  grafana_data:

networks:
  offline_ai_net:
    driver: bridge
