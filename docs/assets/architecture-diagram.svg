<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" fill="none">
  <rect width="920" height="340" rx="18" fill="#09090B"/>
  <rect x="1" y="1" width="918" height="338" rx="17" stroke="#27272A" stroke-width="2"/>

  <!-- Browser / App Chrome -->
  <text x="36" y="42" fill="#F4F4F5" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Offline AI Platform — Architecture &amp; Resource Budget (2 vCPU / 4 GB RAM)</text>

  <!-- Client -->
  <rect x="36" y="76" width="160" height="84" rx="12" fill="#18181B" stroke="#10A37F" stroke-width="2"/>
  <text x="116" y="110" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">React + Tailwind UI</text>
  <text x="116" y="132" text-anchor="middle" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">Nginx Unprivileged :3000</text>
  <text x="116" y="148" text-anchor="middle" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Limit: 96 MiB RAM</text>

  <!-- Arrow Client -> Backend -->
  <path d="M196 118H246" stroke="#10A37F" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="246,113 256,118 246,123" fill="#10A37F"/>

  <!-- Backend -->
  <rect x="258" y="68" width="210" height="100" rx="12" fill="#18181B" stroke="#3B82F6" stroke-width="2"/>
  <text x="363" y="98" text-anchor="middle" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="14" font-weight="700">FastAPI Backend API</text>
  <text x="363" y="118" text-anchor="middle" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">JWT • Rate Limit • SSE • MCP</text>
  <text x="363" y="136" text-anchor="middle" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">Port :8000 (/docs, /metrics)</text>
  <text x="363" y="154" text-anchor="middle" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Limit: 512 MiB RAM</text>

  <!-- Arrow Backend -> Ollama -->
  <path d="M468 100H526" stroke="#A855F7" stroke-width="2.5"/>
  <polygon points="526,95 536,100 526,105" fill="#A855F7"/>

  <!-- Ollama -->
  <rect x="538" y="62" width="185" height="90" rx="12" fill="#18181B" stroke="#A855F7" stroke-width="2"/>
  <text x="630" y="92" text-anchor="middle" fill="#C084FC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Ollama Runtime</text>
  <text x="630" y="112" text-anchor="middle" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">TinyLlama / Qwen2.5 0.5B</text>
  <text x="630" y="134" text-anchor="middle" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">No GPU • Limit: 1900 MiB RAM</text>

  <!-- Postgres -->
  <rect x="258" y="212" width="210" height="84" rx="12" fill="#18181B" stroke="#F59E0B" stroke-width="2"/>
  <text x="363" y="242" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PostgreSQL 16</text>
  <text x="363" y="262" text-anchor="middle" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">Users • Conversations • Messages</text>
  <text x="363" y="280" text-anchor="middle" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Limit: 256 MiB RAM</text>

  <path d="M363 168V202" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="358,202 363,212 368,202" fill="#F59E0B"/>

  <!-- ChromaDB -->
  <rect x="538" y="212" width="185" height="84" rx="12" fill="#18181B" stroke="#EC4899" stroke-width="2"/>
  <text x="630" y="242" text-anchor="middle" fill="#F472B6" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ChromaDB RAG</text>
  <text x="630" y="262" text-anchor="middle" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">PDF / Markdown Vector Index</text>
  <text x="630" y="280" text-anchor="middle" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Embedded In-Process</text>

  <path d="M468 148L532 232" stroke="#EC4899" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Monitoring Stack -->
  <rect x="752" y="68" width="134" height="228" rx="12" fill="#18181B" stroke="#EF4444" stroke-width="2"/>
  <text x="819" y="100" text-anchor="middle" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Observability</text>
  <rect x="768" y="122" width="102" height="44" rx="8" fill="#27272A"/>
  <text x="819" y="148" text-anchor="middle" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="11">Prometheus :9090</text>
  <rect x="768" y="180" width="102" height="44" rx="8" fill="#27272A"/>
  <text x="819" y="206" text-anchor="middle" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="11">Grafana :3001</text>
  <rect x="768" y="238" width="102" height="44" rx="8" fill="#27272A"/>
  <text x="819" y="264" text-anchor="middle" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="11">Node Exp :9100</text>
</svg>
