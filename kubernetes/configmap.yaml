apiVersion: v1
kind: ConfigMap
metadata:
  name: offline-ai-config
  namespace: offline-ai
data:
  APP_NAME: "Offline AI Platform"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_V1_PREFIX: "/api/v1"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: "http://localhost:3000,http://offline-ai.local"
  RATE_LIMIT_REQUESTS: "60"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "offline_ai"
  POSTGRES_USER: "offline_ai_user"
  OLLAMA_BASE_URL: "http://ollama:11434"
  DEFAULT_MODEL: "tinyllama"
  AVAILABLE_MODELS: "tinyllama,qwen2.5:0.5b"
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_MAX_LOADED_MODELS: "1"
  OLLAMA_KEEP_ALIVE: "5m"
  RAG_ENABLED: "true"
  CHROMA_PERSIST_DIR: "/app/data/chroma"
  MCP_ENABLED: "true"
