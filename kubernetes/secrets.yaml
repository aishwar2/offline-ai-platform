# Template Secret manifest for Offline AI Platform.
# Replace placeholder values before applying, or manage via SealedSecrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: offline-ai-secrets
  namespace: offline-ai
type: Opaque
stringData:
  JWT_SECRET_KEY: "replace-with-32-plus-char-random-secret-key"
  POSTGRES_PASSWORD: "replace-with-strong-postgres-password"
  DATABASE_URL: "postgresql+psycopg2://offline_ai_user:replace-with-strong-postgres-password@postgres:5432/offline_ai"
